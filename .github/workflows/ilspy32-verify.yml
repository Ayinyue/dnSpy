# ILSpy 3.2 引擎升级：反编译语料 / IL 一致性 / 性能 / 双 TFM 门禁
#
# 与 build.yml 的分工：build.yml 只在 master 上出发布包；本工作流在
# feature/ilspy32（以及 master）上跑反编译质量门，是引擎升级的验收线。
#
# 顺序有讲究（审计 §8.60 / §8.63）：
#   1) 先按手工命令构建引擎 + net10 扩展（verify-all 会复用这两份产物）；
#   2) 再跑 verify-all（语料 + IL + bench），此时产物是干净的；
#   3) 最后才构建 dnSpy.sln —— 它会激活引擎 DLL 里的 Debug.Assert，
#      所以必须放在所有门禁之后，且必须 -m:1（并行构建会偶发把 net10 的
#      System.Runtime 解析进 net48 编译）。
name: ILSpy 3.2 verify

on:
  push:
    branches: [feature/ilspy32, master]
  pull_request:
    branches: [feature/ilspy32, master]
  workflow_dispatch:

jobs:
  verify:
    name: Decompiler corpus gates
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.x'

      # CI 上必须先 restore：新 checkout 没有 obj/project.assets.json，
      # 否则 Mono.Cecil 解析不到（warning MSB3245 + CS0246 'Mono'）。
      - name: Restore
        run: |
          dotnet restore Extensions/ILSpy32.Decompiler/ICSharpCode.Decompiler/ICSharpCode.Decompiler.csproj
          dotnet restore Extensions/ILSpy32.Decompiler/dnSpy.Decompiler.ILSpy32/dnSpy.Decompiler.ILSpy32.csproj

      # 语料门：9 道（IL 全一致 / C#+VB 三程序集 / bench 性能）。
      # 不带 -NoBuild：verify-all 会按手工命令重建引擎 + net10 扩展 + probe，
      # 这正是 §8.63 要求的「门禁前干净重构建」，避免复用到被 dnSpy.sln 污染的产物。
      - name: verify-all (corpus + IL + bench)
        run: Extensions/ILSpy32.Decompiler/baseline/verify-all.ps1

      # 辅助信号：成员不丢（源码对拍）、token 不重复
      - name: source-check / token-check
        run: |
          $dump = "$env:TEMP\ilspy32-verify-dump"
          dotnet run -c Release --project Extensions/ILSpy32.Decompiler/baseline -- dump --asm "dnSpy/dnSpy/bin/Release/net10.0-windows/dnSpy.Contracts.DnSpy.dll" --impl ilspy32 --lang cs --out $dump --dnspy-dir "dnSpy/dnSpy/bin/Release/net10.0-windows" --all
          py Extensions/ILSpy32.Decompiler/baseline/source-check.py $dump "Extensions/ILSpy32.Decompiler/../../dnSpy/dnSpy.Contracts.DnSpy"
          py Extensions/ILSpy32.Decompiler/baseline/token-check.py $dump

      # 双 TFM 门禁。必须 -m:1，且必须放在最后（见文件头注释）
      - name: Dual-TFM solution build (-m:1)
        run: dotnet build dnSpy.sln -c Release -m:1 --nologo -v q
