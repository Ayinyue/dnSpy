# ILSpy 3.2 引擎升级：反编译语料 / IL 一致性 / 性能 / 双 TFM 门禁
#
# 与 build.yml 的分工：build.yml 只在 master 上出发布包；本工作流在
# feature/ilspy32（以及 master）上跑反编译质量门，是引擎升级的验收线。
#
# 顺序有讲究（审计 §8.60 / §8.63）：
#   1) 先按手工命令构建引擎 + net10 扩展（verify-all 会复用这两份产物）；
#   2) 再跑 verify-all（语料 + IL + bench），此时产物是干净的；
#   3) 最后才构建 dnSpy.sln —— 它会激活引擎 DLL 里的 Debug.Assert，
#      所以必须放在所有门禁之后，且必须 -m:1（并行构建会偶发把 net10 的
#      System.Runtime 解析进 net48 编译）。
name: ILSpy 3.2 verify

on:
  push:
    branches: [feature/ilspy32, master]
  pull_request:
    branches: [feature/ilspy32, master]
  workflow_dispatch:

# 报告发布步骤要把报告推到 ci-reports 分支。
permissions:
  contents: write

jobs:
  verify:
    name: Decompiler corpus gates
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.x'

      # CI 上必须先 restore：新 checkout 没有 obj/project.assets.json，
      # 否则 Mono.Cecil 解析不到（warning MSB3245 + CS0246 'Mono'）。
      - name: Restore
        run: |
          dotnet restore Extensions/ILSpy32.Decompiler/ICSharpCode.Decompiler/ICSharpCode.Decompiler.csproj
          dotnet restore Extensions/ILSpy32.Decompiler/dnSpy.Decompiler.ILSpy32/dnSpy.Decompiler.ILSpy32.csproj

      # 先构建解决方案：probe 的 compile-only 引用（dnlib / dnSpy.Contracts.* /
      # Mono.Cecil）都以 dnSpy bin 下的产物为 HintPath，必须先有那份产物。
      # 必须 -m:1：dnSpy.sln 会激活引擎 DLL 里的 Debug.Assert（§8.63），并行构建
      # 还会偶发把 net10 的 System.Runtime 解析进 net48 编译（§8.60）。
      - name: Build solution (-m:1)
        run: dotnet build dnSpy.sln -c Release -m:1 --nologo -v q

      # 语料门：9 道（IL 全一致 / C#+VB 三程序集 / bench 性能）。
      # 不带 -NoBuild：verify-all 会按手工命令重建引擎 + net10 扩展 + probe，
      # 这正是 §8.63 要求的「门禁前干净重构建」，避免复用到被 dnSpy.sln 污染的产物。
      - name: verify-all (corpus + IL + bench)
        run: |
          Extensions/ILSpy32.Decompiler/baseline/verify-all.ps1
          $code = $LASTEXITCODE
          # 失败时把报告正文打出来：日志下载需要 admin，step 输出网页可见。
          $r = Get-ChildItem Extensions/ILSpy32.Decompiler/baseline/out/verify-*.txt -ErrorAction SilentlyContinue |
               Sort-Object LastWriteTime | Select-Object -Last 1
          if ($r) { Write-Host "=== verify report: $($r.Name) ==="; Get-Content $r.FullName }
          exit $code

      # 报告不随 job 清理；失败时便于直接下载，不必申请日志下载权限。
      - name: verify report artifact
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ilspy32-verify-report
          path: Extensions/ILSpy32.Decompiler/baseline/out/verify-*.txt
          if-no-files-found: ignore

      # 日志下载需要 admin，artifact 下载也需要认证；把报告推到独立分支，
      # raw.githubusercontent.com 可直接读。该分支不在 on.branches 里，不会触发本工作流。
      - name: publish verify report
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $r = Get-ChildItem Extensions/ILSpy32.Decompiler/baseline/out/verify-*.txt -ErrorAction SilentlyContinue |
               Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $r) { Write-Host 'no verify report'; exit 0 }
          $dst = Join-Path $env:TEMP 'ilspy32-reports'
          Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue
          $url = "https://x-access-token:$env:GITHUB_TOKEN@github.com/Ayinyue/dnSpy.git"
          git clone --quiet --depth 1 --branch ci-reports --single-branch $url $dst 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            New-Item -ItemType Directory -Force $dst | Out-Null
            Set-Location $dst
            git init -q
            git checkout -q -b ci-reports
            git remote add origin $url
          } else {
            Set-Location $dst
          }
          New-Item -ItemType Directory -Force (Join-Path $dst 'reports') | Out-Null
          $name = $r.Name
          Copy-Item $r.FullName (Join-Path $dst "reports/$name") -Force
          # source/token-check 的输出也一起发布，便于定位该步骤的失败。
          $logf = Join-Path $env:TEMP 'ilspy32-src-check.log'
          if (Test-Path $logf) { Copy-Item $logf (Join-Path $dst "reports/src-check-$name") -Force }
          git config user.email 'ilspy32-ci@local'
          git config user.name 'ilspy32-ci'
          git add -A
          git commit -q -m "verify report $name"
          git push -q -u origin ci-reports
          Write-Host "published: https://raw.githubusercontent.com/Ayinyue/dnSpy/ci-reports/reports/$name"

      # 辅助信号：成员不丢（源码对拍）、token 不重复。
      # 非阻塞：这两项记录的是 3.2 引擎相对 2.3 的已知残留（审计 §8.7x），
      # 不是门禁；输出照常发布到 ci-reports，便于跟踪修复进度。
      - name: source-check / token-check (advisory)
        continue-on-error: true
        run: |
          $dump = "$env:TEMP\ilspy32-verify-dump"
          $log = "$env:TEMP\ilspy32-src-check.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $out = dotnet run -c Release --project Extensions/ILSpy32.Decompiler/baseline -- dump --asm "dnSpy/dnSpy/bin/Release/net10.0-windows/dnSpy.Contracts.DnSpy.dll" --impl ilspy32 --lang cs --out $dump --dnspy-dir "dnSpy/dnSpy/bin/Release/net10.0-windows" --all 2>&1 | Out-String
          $dumpCode = $LASTEXITCODE
          $out | Tee-Object -FilePath $log
          if ($dumpCode -ne 0) { Write-Host "dump failed: $dumpCode"; exit $dumpCode }
          $out = py Extensions/ILSpy32.Decompiler/baseline/source-check.py $dump "Extensions/ILSpy32.Decompiler/../../dnSpy/dnSpy.Contracts.DnSpy" 2>&1 | Out-String
          $src = $LASTEXITCODE
          $out | Tee-Object -FilePath $log -Append
          $out = py Extensions/ILSpy32.Decompiler/baseline/token-check.py $dump 2>&1 | Out-String
          $tok = $LASTEXITCODE
          $out | Tee-Object -FilePath $log -Append
          Write-Host "source-check exit=$src token-check exit=$tok"
          if ($src -ne 0) { exit $src }
          if ($tok -ne 0) { exit $tok }
